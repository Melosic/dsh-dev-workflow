name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a branch whose run is still going cancels it: the newer commit is the
# only one whose result anyone reads, and PR #55's three rapid pushes spent two
# runner slots on superseded trees. Keyed on the ref, not the SHA — a per-SHA
# group never repeats, so nothing would ever be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Early phases run a single Node version, and it is the current LTS rather than
# the declared floor: Node 20 reached end of life in April 2026, so a matrix that
# only proves the plugin works there proves it works nowhere anyone deploys it.
# `engines.node` still states the floor the code needs.
jobs:
  verify:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 360-minute default: a hung
    # `pnpm install` or spec would hold a runner for six hours before anyone
    # learned it had failed. Recent runs finish in 25-35 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit-message check below diffs against the PR's base SHA, which
          # a shallow clone does not contain.
          fetch-depth: 0

      # The pnpm version comes from package.json `packageManager`; passing
      # `version` here as well makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `src/` does not exist yet in the early phases. `scripts/with-src.mjs`
      # exits 0 with a notice instead of letting tsc fail with TS18003
      # ("No inputs were found in config file"), which is what makes this step
      # conditional on the sources actually being there.
      - name: Typecheck
        run: pnpm typecheck

      # The specs are not published and do not enter the build, but a type error
      # in them is still a broken check: it should fail here rather than surface
      # as an assertion failing in a way nobody can explain.
      - name: Typecheck tests
        run: pnpm typecheck:tests

      # `client.js` is hand-written browser JS that no build compiles, so
      # without this step a renamed Host service would first show up as a blank
      # panel. The declarations come from the pinned client packages.
      - name: Typecheck client
        run: pnpm typecheck:client

      - name: Lint
        run: pnpm lint

      # `.husky/commit-msg` checks one message at commit time; this checks the
      # ones a pull request adds, so a bad message cannot land through the web
      # UI or a local hook that was never installed.
      #
      # Only the PR range is checked. Two commits merged before this gate existed
      # exceed `body-max-line-length` (100, inherited from config-conventional),
      # and rewriting shared history to make them pass is not an option — so the
      # range is grandfathered, not the rule. See docs/PUBLISHING.md §5.
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Locale key alignment, and that the bundle patch is both declared and
      # shipped. Translation *correctness* is intentionally not checked here:
      # it is a human review item.
      - name: Verify locale keys and bundle manifest
        run: pnpm ci:checks
