name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a branch whose run is still going cancels it: the newer commit is the
# only one whose result anyone reads, and PR #55's three rapid pushes spent two
# runner slots on superseded trees. Keyed on the ref, not the SHA — a per-SHA
# group never repeats, so nothing would ever be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit SHA. A tag is a pointer its author can move
# after this file is reviewed; the SHA is the code that was. Dependabot bumps the
# pins (see .github/dependabot.yml) and rewrites the comment beside them.
#
# Two jobs. `verify` is the full suite on the current LTS. `floor` proves the
# declared floor — `engines.node` says `>=20` — on Windows, where the guards under
# `src/` branch on path separators and case folding and a Linux-only run cannot
# see the difference. Running the whole matrix everywhere would double the runner
# cost to prove the same thing.
jobs:
  verify:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 360-minute default: a hung
    # `pnpm install` or spec would hold a runner for six hours before anyone
    # learned it had failed. Recent runs finish in 25-35 seconds.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit-message check below diffs against the PR's base SHA, which
          # a shallow clone does not contain.
          fetch-depth: 0

      # The pnpm version comes from package.json `packageManager`; passing
      # `version` here as well makes the action fail with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `src/` does not exist yet in the early phases. `scripts/with-src.mjs`
      # exits 0 with a notice instead of letting tsc fail with TS18003
      # ("No inputs were found in config file"), which is what makes this step
      # conditional on the sources actually being there.
      - name: Typecheck
        run: pnpm typecheck

      # The specs are not published and do not enter the build, but a type error
      # in them is still a broken check: it should fail here rather than surface
      # as an assertion failing in a way nobody can explain.
      - name: Typecheck tests
        run: pnpm typecheck:tests

      # `client.js` is hand-written browser JS that no build compiles, so
      # without this step a renamed Host service would first show up as a blank
      # panel. The declarations come from the pinned client packages.
      - name: Typecheck client
        run: pnpm typecheck:client

      - name: Lint
        run: pnpm lint

      # `.husky/commit-msg` checks one message at commit time; this checks the
      # ones a pull request adds, so a bad message cannot land through the web
      # UI or a local hook that was never installed.
      #
      # Only the PR range is checked. Two commits merged before this gate existed
      # exceed `body-max-line-length` (100, inherited from config-conventional),
      # and rewriting shared history to make them pass is not an option — so the
      # range is grandfathered, not the rule. See docs/PUBLISHING.md §5.
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

      # The title is the only text from a pull request that survives into `main`
      # — squash merge writes it as the commit message — and it was the one piece
      # of text nothing checked: the range above covers the branch commits, which
      # squash discards. commitlint reads a message from stdin when given no
      # range, so the title goes through the same rules the commits do.
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Locale key alignment, and that the bundle patch is both declared and
      # shipped. Translation *correctness* is intentionally not checked here:
      # it is a human review item. `PR_TITLE` lets the changelog-pairing rule see
      # the same title the step above judged.
      - name: Verify locale keys and bundle manifest
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: pnpm ci:checks

  # The floor, not the tip. `engines.node` says `>=20` and nothing here ran there,
  # so the claim was untested. Windows because half the guards under `src/` branch
  # on path separators and case folding. Only the checks that can fail on a
  # platform difference run here: the full suite stays in `verify`.
  floor:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
