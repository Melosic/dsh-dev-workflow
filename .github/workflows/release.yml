# Publishing by hand is the one step that cannot be undone: npm refuses to
# republish a version, so a tag that disagrees with `package.json`, or a publish
# from a checkout that was never tested, is permanent. This workflow makes the tag
# the trigger and the version the gate — `git push origin v1.2.3` publishes 1.2.3
# or nothing.
#
# `--provenance` needs the OIDC token (`id-token: write`), which is what lets npm
# show the build that produced the tarball. It only works from a public
# repository, which this is.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          # Point npm at the public registry explicitly: a laptop `publishConfig`
          # or a `.npmrc` that redirects to a mirror would otherwise be inherited
          # and the provenance attestation would name a registry nobody uses.
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The tag is the version. A `v0.6.1` tag on a `0.6.0` package publishes the
      # wrong thing under the wrong name, and npm will not let anyone take it back.
      - name: Check the tag against package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $version" >&2
            exit 1
          fi

      # The same gate a pull request goes through. A tag can be pushed from a
      # commit that never saw CI — a local branch, a hotfix — so the checks run
      # again here rather than trusting the history.
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

      # `ci:checks` rule 5 asserts the entry points a consumer imports are on
      # disk — those are `lib/`, which only exists after a build. It has to come
      # before that gate here exactly as it does in `ci.yml`. `prepublishOnly`
      # builds too, but it runs inside `npm publish`, i.e. after the gate that
      # guards the publish — too late to satisfy rule 5.
      - name: Build
        run: pnpm build

      - name: Verify locale keys and bundle manifest
        run: pnpm ci:checks

      # `prepublishOnly` runs lint, types, tests, build and `ci:checks` again; that
      # is deliberate repetition — it is the same guard for a laptop publish, and
      # the cost is seconds. What it does not do is `format:check`, so that is
      # here too.
      - name: Check formatting
        run: pnpm format:check

      # Publishing is the one step that cannot be undone, so it is also the one
      # step that must not fail for having already happened. npm refusing a
      # republish is correct; a tag that stops halfway because the same version
      # went out from a laptop first is not. The registry — not this file — is
      # the authority on whether the version exists, so ask it.
      - name: Publish with provenance
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; skipping the publish step."
            echo "That copy was published outside this workflow, so it has no provenance."
            exit 0
          fi
          # No secret is configured today: this repository publishes from the
          # maintainer's machine, and a tag run finds the version already there
          # and takes the branch above. Saying so beats a bare 401 from npm, which
          # reads like an authentication bug in the workflow rather than a
          # missing setting with two known fixes.
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "$name@$version is not on the registry, and no NPM_TOKEN secret is configured." >&2
            echo "Add the secret (Settings -> Secrets and variables -> Actions) or publish from a laptop: docs/PUBLISHING.md step 5." >&2
            exit 1
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry, not the build log, is the record. A publish that reported
      # success but did not land — a token with the wrong package, a registry
      # hiccup — is caught here instead of by the first user who tries to install.
      - name: Verify the published tarball
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "@melosic/dsh-dev-workflow@$version" version)"
          if [ "$published" != "$version" ]; then
            echo "registry reports $published, expected $version" >&2
            exit 1
          fi

      # The release page is generated from the merged commits and the
      # `Full Changelog` link is added by GitHub, so there is no hand-copied notes
      # file to drift. docs/PUBLISHING.md §7 says what a good page still needs on
      # top — upgrade and known issues — and that is an edit, not a rewrite.
      # Same reasoning as the publish step: creating a release for a tag that
      # already has one cannot be undone either, and re-running a partially
      # failed job is the obvious repair. The page is not rewritten when it
      # exists — a hand-edited bilingual page is what docs/PUBLISHING.md asks
      # for, and overwriting it with generated notes would lose the edit.
      - name: Create the GitHub release
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release page for $GITHUB_REF_NAME already exists; leaving it as it is."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
